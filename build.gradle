plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id 'org.owasp.dependencycheck' version '9.0.9'
    id 'org.asciidoctor.jvm.convert' version '4.0.2'
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'signing'
    // Maven Central(Central Publisher Portal) 배포용 -- Sonatype은 공식 Gradle 플러그인을
    // 제공하지 않아서(central.sonatype.org 문서가 직접 안내) 커뮤니티 표준으로 자리잡은
    // vanniktech/gradle-maven-publish-plugin을 쓴다. 계정 생성/네임스페이스(io.github.search5)
    // 검증/User Token 발급은 https://central.sonatype.com 에서 별도로 진행 후
    // ~/.gradle/gradle.properties에 mavenCentralUsername/mavenCentralPassword로 등록해야
    // 실제 배포(./gradlew publishToMavenCentral)가 동작한다.
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

// 여러 에이전트/터미널이 같은 체크아웃에서 동시에 빌드를 돌릴 때 build/ 산출물(컴파일된
// 클래스, jacoco exec/report)이 서로 덮어써지는 것을 막기 위한 탈출구. 지정 안 하면
// 평소처럼 build/ 그대로 쓴다. 사용 예: ./gradlew -PagentBuildDir=/tmp/agent1-build ...
if (project.hasProperty('agentBuildDir')) {
    layout.buildDirectory.set(file(agentBuildDir))
}

group = 'io.github.search5.hg4j'
version = '1.0.1'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

// Asciidoc 매뉴얼(src/docs/asciidoc)이 include::로 발췌하는 예제 코드 전용 소스셋. main
// 산출물에 대해 실제로 컴파일되므로(compileDocExamplesJava), API가 바뀌면 매뉴얼 예제가
// 조용히 깨지는 대신 빌드가 즉시 실패한다 -- jar에는 포함되지 않는 문서 전용 코드.
sourceSets {
    docExamples {
        java.srcDirs = ['src/docs/examples/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    docExamplesImplementation.extendsFrom implementation
}

dependencies {

    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    implementation 'com.github.mwiede:jsch:0.2.17'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.78'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.78'
    // HgHttpWireServer is a jakarta.servlet.http.HttpServlet -- callers/tests host it in whatever
    // servlet container they like (only the API is a compile/runtime dependency of the library
    // itself; the container is a test-only concern, see the jetty-ee11 deps below).
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.bouncycastle:bcpg-jdk18on:1.78'
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.78'
    testImplementation 'org.bouncycastle:bcutil-jdk18on:1.78'

    testImplementation 'org.apache.sshd:sshd-core:2.12.0'
    testImplementation 'org.apache.sshd:sshd-common:2.12.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
    // Embedded servlet container to actually host HgHttpWireServer in tests (ee11 = Jakarta EE 11 /
    // Servlet 6.1, matching jakarta.servlet-api above).
    testImplementation 'org.eclipse.jetty:jetty-server:12.1.12'
    testImplementation 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.12'
}

// Maven Central(Central Publisher Portal) 배포 설정. vanniktech 플러그인이 내부적으로
// maven-publish의 publications/repositories를 구성하므로, 이전에 여기 있던 수동
// `publishing { publications { mavenJava(...) } }` 선언은 제거했다(같은 컴포넌트를 두 번
// 등록하면 충돌한다) -- Gradle Plugin Portal용 `pluginMaven`/마커 publication(java-gradle-plugin이
// 자동 생성, 서명도 com.gradle.plugin-publish가 signing 플러그인을 감지해 자동으로 처리)은
// 완전히 별개라 이 블록의 영향을 받지 않는다.
mavenPublishing {
    coordinates('io.github.search5.hg4j', 'hg4j', version.toString())

    // 업로드만 하고 실제 공개(release)는 Central Portal 웹 UI에서 사람이 확인 후 누르도록
    // 일부러 자동 릴리스(publishToMavenCentral(true)/publishAndReleaseToMavenCentral)를 쓰지
    // 않는다 -- Central은 한 번 배포된 버전을 절대 삭제/수정할 수 없으므로, 첫 배포는 특히
    // 수동 검토 단계를 거치는 게 안전하다.
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'hg4j'
        description = 'Pure Java implementation of Mercurial (hg) version control system'
        url = 'https://github.com/search5/hg4j'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'hg4j'
                name = 'Andrew Lee'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/search5/hg4j.git'
            developerConnection = 'scm:git:ssh://github.com/search5/hg4j.git'
            url = 'https://github.com/search5/hg4j'
        }
    }
}

jar {
    from("${rootDir}") {
        include 'LICENSE'
        into 'META-INF'
    }
}

test {
    useJUnitPlatform {
        excludeTags 'interop'
    }
    maxHeapSize = "2048m"
    maxParallelForks = 1
    forkEvery = 100
    // Force complete inclusion of runtime configurations to prevent JPMS/testRuntime resolution drops
    classpath = sourceSets.test.runtimeClasspath + project.configurations.testRuntimeClasspath
    finalizedBy jacocoTestReport
}

// Real hg CLI / Docker 기반 interop 테스트(@Tag("interop"))는 기본 `test`에서 제외되고
// 이 태스크로만 돈다 -- 매트릭스가 커지면서 기본 테스트 루프가 계속 느려지는 문제를
// 해결하기 위해 2026-09-04 분리(사용자 지시). `./gradlew interopTest`로 명시적으로 실행.
tasks.register('interopTest', Test) {
    group = 'verification'
    description = 'Runs real hg CLI / Docker 기반 interop 테스트만(@Tag("interop")). 느리고 hg/Docker 설치가 필요함.'
    useJUnitPlatform {
        includeTags 'interop'
    }
    maxHeapSize = "2048m"
    maxParallelForks = 1
    forkEvery = 100
    classpath = sourceSets.test.runtimeClasspath + project.configurations.testRuntimeClasspath
    testClassesDirs = sourceSets.test.output.classesDirs
    binaryResultsDirectory = layout.buildDirectory.dir("interop-test-results/binary")
    reports {
        html.outputLocation = layout.buildDirectory.dir("reports/interop-tests")
        junitXml.outputLocation = layout.buildDirectory.dir("interop-test-results/xml")
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    // interopTest도 합쳐야 실제 커버리지를 정확히 반영한다 -- PushCommand/ShelveCommand/
    // TagCommand/Bundle2Parser 등 여러 핵심 클래스가 real hg CLI/Docker 기반 interop
    // 테스트로만 커버되는 경로가 많다(2026-09-04, test/interopTest 분리 직후 실측 확인:
    // interopTest 없이는 이 클래스들이 90% 클래스별 규칙에서 전부 미달로 떨어짐). 평소
    // 빠른 `test`는 그대로 두고, 커버리지 집계는 두 태스크의 실행 데이터를 합쳐서 계산.
    dependsOn test, interopTest
    executionData test, interopTest
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test, interopTest
    executionData test, interopTest
    violationRules {
        // 규칙 1: 전체 번들 커버리지 (최소 70% - 네트워크 의존 클래스 제외 전 기준)
        rule {
            element = 'BUNDLE'
            limit {
                minimum = 0.70
            }
        }
        // 규칙 2: 클래스 별 90% 규칙 (외부 의존성이 없는 핵심 클래스만 적용)
        rule {
            element = 'CLASS'
            includes = [
                'io.github.search5.hg4j.dirstate.Dirstate',
                'io.github.search5.hg4j.util.NodeIdUtil',
                'io.github.search5.hg4j.util.SafeFileIO',
                'io.github.search5.hg4j.merge.Merge3',
                'io.github.search5.hg4j.bundle.Bundle2Parser',
                'io.github.search5.hg4j.bundle.ChangegroupParser',
                'io.github.search5.hg4j.api.AddCommand',
                'io.github.search5.hg4j.api.BookmarkCommand',
                'io.github.search5.hg4j.api.BranchCommand',
                'io.github.search5.hg4j.api.InitCommand',
                'io.github.search5.hg4j.api.LogCommand',
                'io.github.search5.hg4j.api.RemoveCommand',
                'io.github.search5.hg4j.api.RevertCommand',
                'io.github.search5.hg4j.api.ShelveCommand',
                'io.github.search5.hg4j.api.StatusCommand',
                'io.github.search5.hg4j.api.TagCommand',
                'io.github.search5.hg4j.api.PushCommand',
                'io.github.search5.hg4j.api.CatCommand',
                'io.github.search5.hg4j.api.DiffCommand',
                'io.github.search5.hg4j.api.TreeCommand',
                'io.github.search5.hg4j.api.UpdateCommand',
            ]
            limit {
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

dependencyCheck {
    autoUpdate = true
    failBuildOnCVSS = 7.0f
    format = 'ALL'
}

compileJava {
    exclude 'module-info.java'
}

// 2번: Javadoc 다국어(영문/국문) 빌드 설정
//
// JGit(org.eclipse.jgit) 공식 pom.xml 구조를 그대로 따른다 -- UMLDoclet/MDoclet 같은 서드파티
// doclet 대신 표준 Javadoc + JDK 자체 관례인 @apiNote/@implSpec/@implNote 태그로 계약(API
// 사용자가 알아야 할 것)/구현 세부사항/구현 참고사항을 구조적으로 분리한다. 전체 public
// 메서드/생성자에 Javadoc(@param/@return/@throws 포함)을 채운 뒤로는 doclint를 all로 켜서
// 신규 코드의 문서화 누락을 빌드 시점에 잡아낸다.
// javadoc -tag 형식 "이름:위치:제목" (JGit pom.xml의 <tags> 설정과 동일한 3종 태그).
def javadocTags = [
    'apiNote:a:API Note:',
    'implSpec:a:Implementation Requirements:',
    'implNote:a:Implementation Note:',
]

javadoc {
    failOnError = false
    options {
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'
        locale = 'en_US' // 기본 영어 로케일 설정
        links('https://docs.oracle.com/en/java/javase/21/docs/api/')
        tags = javadocTags
        addStringOption('Xdoclint:all', '-quiet')
    }
}

task javadocKo(type: Javadoc) {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = file("${buildDir}/docs/javadoc-ko")
    failOnError = false
    options {
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'
        locale = 'ko_KR' // 한국어 로케일 설정
        links('https://docs.oracle.com/en/java/javase/21/docs/api/')
        tags = javadocTags
        addStringOption('Xdoclint:all', '-quiet')
    }
}

// 1번: Asciidoctor 다국어 문서화 태스크 설정
asciidoctor {
    // 예제 코드가 실제로 컴파일되는지 먼저 검증 -- 매뉴얼 발췌 소스가 깨진 채 방치되는 걸 막는다.
    dependsOn tasks.named('compileDocExamplesJava')
    sourceDir  file('src/docs/asciidoc')
    sources {
        include '**/index.adoc'
    }
    outputDir file('build/docs/asciidoc')
    options doctype: 'book'
    attributes 'source-highlighter': 'coderay',
               'toc': 'left',
               'icons': 'font',
               'sectnums': '',
               'examplesdir': "${projectDir}/src/docs/examples/java/io/github/search5/hg4j/docs/examples"
}

// Gradle Plugin Portal 배포를 위한 플러그인 정의 설정
gradlePlugin {
    // Plugin Portal's approval criteria (https://plugins.gradle.org/docs/publish-plugin#approval)
    // require the project URL to point to English documentation, the project sources, or both --
    // the bare repository root alone got this plugin rejected for "lacks documentation", so this
    // points directly at the English entry point of the real user manual (AsciiDoc, auto-deployed
    // to GitHub Pages by .github/workflows/docs.yml). Deliberately not the language-autodetecting
    // landing page (the bare root URL), since a reviewer's browser locale could redirect it to
    // Korean.
    website = 'https://search5.github.io/hg4j/en/index.html'
    vcsUrl = 'https://github.com/search5/hg4j.git'
    plugins {
        hg4jPlugin {
            id = 'io.github.search5.hg4j'
            displayName = 'hg4j Gradle SCM Plugin'
            description = 'Pure Java Mercurial (hg) Gradle integration plugin modeled after JGit.'
            tags.set(['mercurial', 'hg', 'vcs', 'hg4j'])
            implementationClass = 'io.github.search5.hg4j.HgPlugin'
        }
    }
}

// 3번: GPG 아티팩트 서명 -- mavenPublishing { signAllPublications() } (위)가 Central용
// 퍼블리케이션 서명을 맡고, Gradle Plugin Portal용 pluginMaven/마커 퍼블리케이션은
// com.gradle.plugin-publish가 signing 플러그인을 감지해 알아서 서명한다(2026-09-10 실측:
// 이 수동 블록 없이 ./gradlew publishPlugins가 signHg4jPluginPluginMarkerMavenPublication/
// signPluginMavenPublication을 자체적으로 실행함) -- 그래서 여기서 수동으로 sign()을 호출할
// 대상이 더 이상 없다(이전엔 이제는 없는 `mavenJava` 퍼블리케이션을 가리키다 빌드가 깨졌었다).

// Gradle 9 암시적 태스크 종속성 경고 및 충돌 방지 설정
tasks.withType(PublishToMavenRepository).configureEach {
    mustRunAfter(tasks.withType(Sign))
}
tasks.withType(PublishToMavenLocal).configureEach {
    mustRunAfter(tasks.withType(Sign))
}

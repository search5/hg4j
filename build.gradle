plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id 'org.owasp.dependencycheck' version '9.0.9'
    id 'org.javamodularity.moduleplugin' version '1.8.15'
}

group = 'org.hg4j'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
    modularity.inferModulePath = true
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    implementation 'com.github.mwiede:jsch:0.2.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    testImplementation 'org.apache.sshd:sshd-core:2.12.0'
    testImplementation 'org.apache.sshd:sshd-common:2.12.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'hg4j'
                description = 'Pure Java implementation of Mercurial (hg) version control system'
                url = 'https://github.com/hg4j/hg4j'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'hg4j'
                        name = 'hg4j contributors'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/hg4j/hg4j.git'
                    developerConnection = 'scm:git:ssh://github.com/hg4j/hg4j.git'
                    url = 'https://github.com/hg4j/hg4j'
                }
            }
        }
    }
}

jar {
    from("${rootDir}") {
        include 'LICENSE'
        into 'META-INF'
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = "2048m"
    maxParallelForks = 1
    forkEvery = 100
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        // 규칙 1: 전체 번들 커버리지 (최소 70% - 네트워크 의존 클래스 제외 전 기준)
        rule {
            element = 'BUNDLE'
            limit {
                minimum = 0.70
            }
        }
        // 규칙 2: 클래스 별 90% 규칙 (외부 의존성이 없는 핵심 클래스만 적용)
        rule {
            element = 'CLASS'
            includes = [
                'org.hg4j.core.Dirstate',
                'org.hg4j.core.NodeIdUtil',
                'org.hg4j.core.SafeFileIO',
                'org.hg4j.core.Merge3',
                'org.hg4j.core.Bundle2Parser',
                'org.hg4j.core.ChangegroupParser',
                'org.hg4j.api.AddCommand',
                'org.hg4j.api.BookmarkCommand',
                'org.hg4j.api.BranchCommand',
                'org.hg4j.api.InitCommand',
                'org.hg4j.api.LogCommand',
                'org.hg4j.api.RemoveCommand',
                'org.hg4j.api.RevertCommand',
                'org.hg4j.api.ShelveCommand',
                'org.hg4j.api.StatusCommand',
                'org.hg4j.api.TagCommand',
                'org.hg4j.api.PushCommand',
                'org.hg4j.api.CatCommand',
                'org.hg4j.api.DiffCommand',
                'org.hg4j.api.TreeCommand',
                'org.hg4j.api.UpdateCommand',
            ]
            limit {
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

dependencyCheck {
    autoUpdate = true
    failBuildOnCVSS = 7.0f
    format = 'ALL'
}

compileJava {
    exclude 'module-info.java'
}
